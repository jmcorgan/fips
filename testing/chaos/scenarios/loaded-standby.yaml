# One peer, two paths: the standby starved under load, then the cable lost
#
# Two nodes joined by a raw-Ethernet veth (the cable, 1 to 3 ms) and by UDP
# over the bridge delayed 500 ms each way. The cable carries the link.
#
# The mechanism: under load, a standby probe sent on the slow bridge
# arrives 500 ms behind the frames sent on the cable at the same time.
# Once the cable carries more than 2048 frames in that time, which the
# containers sustain (12405 frames/s at the tenth percentile, measured on
# the development host; 500 ms covers hosts down to 6144 frames/s
# with a margin of 1.5), the standby's probes and answers fall outside the
# receiver's replay window and are rejected, so the standby goes Suspect
# and then Dead at both ends: K timeouts, then `retire` at the standby
# cadence, about 14 s plus the longer probe timeout a 1 s round trip
# gives. The load runs 25 s before the cable goes.
#
# Then the cable is taken down administratively at n01. With nothing Live,
# the draft (5.7) requires each end to probe its acked Dead standby at
# once, which revives it: `rescue` checks that probe at each end, within
# 60 ms of the step in which the active path left Live or was released,
# and the standby Live within 2 x 500 ms + 1 s, with no peer removed. Its
# control is that the standby was Dead at both ends before the cut; a run
# whose standby was only Suspect did not exercise the rule and fails.
#
#   n01 ===eth=== n02      (loaded from 10 s for 50 s; down at n01 at 35 s for 20 s)
#   n01 ---udp--- n02      (500 ms each way)

scenario:
  name: "loaded-standby"
  seed: 42
  duration_secs: 90

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, ethernet+udp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 0]
    loss_pct: [0, 0]
  bridge_policy:
    delay_ms: [500, 500]
    jitter_ms: [0, 0]
    loss_pct: [0, 0]

link_flaps:
  enabled: false

traffic:
  enabled: false

schedule:
  - {at: 10, load: [n01, n02], secs: 50, streams: 4, bidir: true}
  - {at: 35, down: [n01, n02], mode: admin, end: n01, secs: 20}

node_churn:
  enabled: false

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  rescue:
    delay_ms: 500

  max_promotions:
    per_node: 1
  max_dials: 0
  paths_live:
    min: 2

logging:
  # The decryption failures are the replay rejections that kill the
  # standby; they are debug lines of the encrypted dataplane.
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug,fips::node::dataplane::encrypted=debug"
  output_dir: "./sim-results"
