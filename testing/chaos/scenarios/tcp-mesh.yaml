# Mixed transport mesh: 6 nodes, UDP + TCP edges
#
# Exercises both transports in a single mesh. UDP and TCP edges both
# use static peer config. Tests that the spanning tree converges
# across heterogeneous transports with netem and link flaps active.
#
# Topology:
#
#   n01 ---udp--- n02 ---udp--- n03
#    |             |              |
#   tcp           tcp            udp
#    |             |              |
#   n04 ---tcp--- n05 ---udp--- n06
#
# UDP edges: n01-n02, n02-n03, n03-n06, n05-n06
# TCP edges: n01-n04, n02-n05, n04-n05
#
# Dialed from both ends: n01-n02, n03-n06 and n05-n06 (UDP) and n01-n04
# (TCP). Each of their ends lists the other as a static peer, both dial at
# startup, and the harness holds the edge under a netem delay until every
# node has started, so the two handshakes cross and the crossing has to be
# resolved (testing/chaos/README.md, "Directed Outbound Configs"). The other
# three edges, n02-n03 (UDP) and n02-n05 and n04-n05 (TCP), keep one dialer
# each, so reconnection by the one end that dials stays exercised on both
# transports.

scenario:
  name: "tcp-mesh"
  seed: 42
  duration_secs: 120

topology:
  algorithm: explicit
  num_nodes: 6
  params:
    adjacency:
      - [n01, n02, udp, {dial: both}]
      - [n02, n03, udp]
      - [n03, n06, udp, {dial: both}]
      - [n05, n06, udp, {dial: both}]
      - [n01, n04, tcp, {dial: both}]
      - [n02, n05, tcp]
      - [n04, n05, tcp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 10]
    jitter_ms: [0, 2]
    loss_pct: [0, 1]
  mutation:
    interval_secs: {min: 20, max: 40}
    fraction: 0.3
    policies:
      normal:
        delay_ms: [1, 10]
        loss_pct: [0, 1]
      degraded:
        delay_ms: [30, 80]
        jitter_ms: [5, 20]
        loss_pct: [3, 8]

link_flaps:
  enabled: true
  interval_secs: {min: 20, max: 40}
  max_down_links: 1
  down_duration_secs: {min: 10, max: 20}
  protect_connectivity: true

traffic:
  enabled: false

# Baseline: the mesh came up, agreed on a root, and took parents. This
# asserts nothing about TCP transport specifically; it exists so that a
# run in which the mesh never formed cannot report success, which until
# now it could, because this scenario carried no assertions at all.
#
# Six nodes, one root, five parented in all six provably-completed
# archived runs.
assertions:
  baseline:
    min_nodes_reporting: 6
    max_roots: 1
    min_nodes_parented: 5
  # Both ends of every edge agree on the link between them: one session
  # index pair, one end outbound and one inbound, the dialer outbound on a
  # one-way edge, the edge's transport and the other end's address. An edge
  # that disagrees is re-read until it agrees, for up to the same 90 s the
  # tree's settle allows, since a rekey can be mid-cutover at any one read.
  #
  # On an edge whose crossing the logs show, the smaller node by address
  # must hold the link it dialed, as FRC-1201 Section 5.6 resolves a
  # crossing, unless the crossing's record was ended first: by a later
  # install for the peer at that node, or by that node adopting a rekey
  # answer on the connection the peer's msg1 arrived on. min_crossings is
  # the number of edges that must show a crossing, so a run in which the
  # crossings stopped happening cannot pass by judging nothing. All four
  # both-dial edges are expected to cross: measured 2026-11-21 over 20 runs,
  # ten at each multipath setting, every one of the 80 both-dial edge-runs
  # crossed, UDP and TCP alike. The floor of 2 leaves a margin of two edges.
  # Do not lower it to make a run pass: a run under it means the crossing
  # mechanism or the node changed, and that is looked at first.
  edge_agreement:
    within_secs: 90
    min_crossings: 2

# The crossing lines are debug lines, and min_crossings needs them.
logging:
  rust_log: "debug"
  output_dir: "./sim-results"
