# Mixed transport mesh: 6 nodes, UDP + TCP edges
#
# Exercises both transports in a single mesh. UDP and TCP edges both
# use static peer config. Tests that the spanning tree converges
# across heterogeneous transports with netem and link flaps active.
#
# Topology:
#
#   n01 ---udp--- n02 ---udp--- n03
#    |             |              |
#   tcp           tcp            udp
#    |             |              |
#   n04 ---tcp--- n05 ---udp--- n06
#
# UDP edges: n01-n02, n02-n03, n03-n06, n05-n06
# TCP edges: n01-n04, n02-n05, n04-n05
#
# Every edge has one dialer on next. Master dials n01-n02, n03-n06 and
# n05-n06 (UDP) and n01-n04 (TCP) from both ends, so their handshakes cross
# and the crossing has to be resolved. Next keeps each of them one-way
# until its own crossing is settled: on next a crossed edge has been seen
# to end with both ends listing it outbound, and next's msg3 crossing
# keeps both connections. Its fix has no plan yet. The crossing clause of
# edge_agreement assumes the smaller node keeps its own dial, which next's
# rule after a refusal does not give. The both-dial edges come back with
# that fix.

scenario:
  name: "tcp-mesh"
  seed: 42
  duration_secs: 120

topology:
  algorithm: explicit
  num_nodes: 6
  params:
    adjacency:
      - [n01, n02, udp]
      - [n02, n03, udp]
      - [n03, n06, udp]
      - [n05, n06, udp]
      - [n01, n04, tcp]
      - [n02, n05, tcp]
      - [n04, n05, tcp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 10]
    jitter_ms: [0, 2]
    loss_pct: [0, 1]
  mutation:
    interval_secs: {min: 20, max: 40}
    fraction: 0.3
    policies:
      normal:
        delay_ms: [1, 10]
        loss_pct: [0, 1]
      degraded:
        delay_ms: [30, 80]
        jitter_ms: [5, 20]
        loss_pct: [3, 8]

link_flaps:
  enabled: true
  interval_secs: {min: 20, max: 40}
  max_down_links: 1
  down_duration_secs: {min: 10, max: 20}
  protect_connectivity: true

traffic:
  enabled: false

# Baseline: the mesh came up, agreed on a root, and took parents. This
# asserts nothing about TCP transport specifically; it exists so that a
# run in which the mesh never formed cannot report success, which until
# now it could, because this scenario carried no assertions at all.
#
# Six nodes, one root, five parented in all six provably-completed
# archived runs.
assertions:
  baseline:
    min_nodes_reporting: 6
    max_roots: 1
    min_nodes_parented: 5
  # Both ends of every edge agree on the link between them: one session
  # index pair, one end outbound and one inbound, the dialer outbound, the
  # edge's transport and the other end's address. An edge that disagrees is
  # re-read until it agrees, for up to the same 90 s the tree's settle
  # allows, since a rekey can be mid-cutover at any one read.
  #
  # Every edge here is one-way, so none is expected to cross, and no
  # min_crossings floor is set: one-way edges cross nothing, and a floor
  # would red as observing nothing. The crossing clause still reads any
  # swap or keep line the logs show, but on next it may find none even
  # where edges cross: with the both-dial edges restored (2026-11-22, one
  # run at each multipath setting), next's crossings logged only
  # "Cross-connection detected", which the clause does not read, and it
  # recorded no crossed edge.
  edge_agreement:
    within_secs: 90

# The crossing lines are debug lines, and the crossing clause reads them.
logging:
  rust_log: "debug"
  output_dir: "./sim-results"
