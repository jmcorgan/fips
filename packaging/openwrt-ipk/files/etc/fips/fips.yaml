# FIPS Node Configuration

node:
  identity:
    # By default, a new ephemeral keypair is generated on each start.
    # Uncomment persistent to keep the same identity across restarts;
    # on first start a keypair is saved to fips.key/fips.pub next to
    # this config file (mode 0600/0644).
    # persistent: true
    #
    # Or set an explicit key (overrides persistent):
    # nsec: "nsec1..."
  # Multipath (node.path.*): keep every proven path to a peer and move a link
  # between them with no new handshake. On by default; defaults shown. A
  # transport's role (never, backup, normal, preferred) places it among a
  # link's paths, and a UDP or TCP transport on a VPN over RFC 1918 space
  # takes kind: internet.
  # path:
  #   enabled: true
  #   min_samples: 2
  #   mix_kinds: true
  #   switch:
  #     margin: 1.3
  #     dwell_secs: 2
  #   probe:
  #     active_ms: 200
  #     standby_ms: 1000
  # Mesh-lookup protocol (node.lookup.*): the overlay coordinate-lookup engine
  # (mesh address -> coordinates). Defaults shown; uncomment to override.
  # lookup:
  #   ttl: 64
  #   attempt_timeouts_secs: [1, 2, 4, 8]
  #   recent_expiry_secs: 10
  #   backoff_base_secs: 0
  #   backoff_max_secs: 0
  #   forward_min_interval_secs: 2
  rendezvous:
    # Optional Nostr-mediated overlay endpoint rendezvous.
    # nostr:
    #   enabled: true
    #   policy: configured_only  # disabled | configured_only | open
    #   open_discovery_max_pending: 64 # caps queued open-rendezvous retries
    #   app: "fips-overlay-v1"
    #   advertise: true
    #   advert_relays:
    #     - "wss://relay.damus.io"
    #     - "wss://nos.lol"
    #     - "wss://offchain.pub"
    #   dm_relays:
    #     - "wss://relay.damus.io"
    #     - "wss://nos.lol"
    #     - "wss://offchain.pub"
    #   # Optional override. If omitted, FIPS uses the built-in STUN list.
    #   # Built-in relay/STUN defaults are best-effort and should be
    #   # overridden by operators for production use.
    #   stun_servers:
    #     - "stun:stun.l.google.com:19302"
    #     - "stun:stun.cloudflare.com:3478"
    #     - "stun:global.stun.twilio.com:3478"

    # mDNS/DNS-SD peer rendezvous on the local link. Ships commented (the
    # daemon default is off); 'fips-ap-setup' uncomments it when creating
    # the access SSID — phone FIPS apps cannot see raw-Ethernet beacons,
    # so mDNS is how they find this router's daemon. Daemon-wide switch,
    # left enabled on 'fips-ap-setup remove'.
    # lan:
    #   enabled: true

tun:
  enabled: true
  # The fips firewall zone holds the TUN by this name. A new name must be
  # added to the zone too (uci add_list firewall.fips.device=<name>), or
  # the TUN is in no firewall zone.
  name: fips0
  mtu: 1280

dns:
  enabled: true
  # bind_addr defaults to "::1" (IPv6 loopback). The shipped
  # fips-dns-setup script configures systemd-resolved with a global
  # /etc/systemd/resolved.conf.d/fips.conf drop-in pointing at
  # [::1]:5354.
  #
  # A wildcard bind such as "::" serves hosts on the router's other
  # networks that the firewall admits to the port (the LAN zone, by
  # default). While fips0 is in the fips firewall zone, that zone rejects
  # mesh peers' queries, and the responder also drops queries arriving on
  # fips0 while its mesh filter is on (it is off when the daemon logs
  # "Mesh interface index unresolved; DNS mesh filter disabled" at start).
  # Any address other than loopback is reachable by every host the
  # firewall admits on that network. Replies follow the routing table, and
  # the stock fw4 zones do not filter by source address, so a host on
  # those networks that forges a mesh source address (fd00::/8) has the
  # reply sent into the mesh from this node's mesh address.
  # bind_addr: "::1"
  port: 5354

transports:
  udp:
    # Dual-stack wildcard, not "0.0.0.0": access-SSID clients (phones) learn
    # this node's addresses from the mDNS advert and prefer the IPv6
    # link-local — a v4-only bind silently drops their Noise msg1.
    # OpenWrt is Linux (bindv6only=0), so "[::]" accepts v4 too.
    bind_addr: "[::]:2121"
    # advertise_on_nostr: true
    # public: false # false => advertise udp:nat; true => advertise bound host:port
    # accept_connections: true # default; refuse inbound msg1 when false
    # outbound_only: false     # true => bind ephemeral, no listener on a
    #                          # known port. Forces advertise_on_nostr=false
    #                          # and accept_connections=false. Pure-client
    #                          # posture; bind_addr is ignored.

  tcp:
    # Accepts inbound connections. No static outbound peers.
    bind_addr: "0.0.0.0:8443"
    # advertise_on_nostr: true

  # Ethernet transport. Each entry names one interface; run 'ip link show'
  # on the router to see the names. For the LAN, bind the LAN bridge
  # (br-lan), never one of its member ports: a socket on a bridge member
  # port sends frames but never forms a link, because the bridge takes the
  # frames that arrive on its members, whether or not br_netfilter is
  # loaded. Ports outside any bridge (the WAN port, phy0-sta0) bind by
  # their own name. A DSA switch with hardware bridge offload has not been
  # checked and needs a check on the router.
  ethernet:
    wan:
      interface: "eth0"
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true
    wwan:
      interface: "phy0-sta0"
      # Only exists while a radio is in station mode. Absence is normal, so
      # it must not report the router Degraded.
      optional: true
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true
    lan:
      interface: "br-lan"
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true

    # 802.11s mesh backhaul between FIPS routers. These entries ship
    # ENABLED and marked 'optional: true'. The daemon treats a named
    # interface that is not there as absent rather than as a failure: it
    # waits, binds the moment 'fips-mesh-setup <radio>' creates the
    # interface, and unbinds again if it goes away — no config edit and no
    # restart, and 'optional: true' keeps a stock install that never runs
    # that script quiet and un-Degraded.
    #
    # Dual-band routers can mesh on both bands at once: FIPS keeps both as
    # paths of one link to a peer and sends on one at a time, the other
    # standing by. The mesh runs OPEN (no SAE) with 802.11s forwarding off: FIPS's
    # Noise handshake is the encryption and authentication, and FIPS is the
    # routing layer. See docs/how-to/set-up-80211s-mesh-backhaul.md.
    mesh0:
      interface: "fips-mesh0"
      optional: true
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true
    mesh1:
      interface: "fips-mesh1"
      optional: true
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true

    # Open "!FIPS" access SSID for phones and laptops running FIPS. Ships
    # ENABLED and marked 'optional: true', for the same reason as the mesh
    # blocks above: 'fips-ap-setup <radio>' creates the interface and the
    # daemon binds it when it appears, with no config edit and no restart.
    #
    # The SSID is OPEN and isolated on purpose: FIPS's Noise handshake is the
    # only security layer. On the access network, associated clients reach
    # ICMPv6, DHCPv4, mDNS and the FIPS transports and nothing else; what
    # they then send over FIPS to the router arrives on fips0 and meets the
    # fips firewall zone, which rejects all but replies, ping and gateway
    # port forwards. See docs/how-to/set-up-open-access-ssid.md.
    ap0:
      interface: "fips-ap0"
      optional: true
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true
    ap1:
      interface: "fips-ap1"
      optional: true
      listen: true
      announce: true
      auto_connect: true
      accept_connections: true

  # No BLE transport: OpenWrt builds target musl, which has no BlueZ backend.

# Outbound LAN gateway. While it runs, the fips-gateway init script points
# dnsmasq's .fips forwarding at the port dns.listen sets (default [::1]:5365).
# Requires IPv6 forwarding enabled.
gateway:
  enabled: true
  pool: "fd01::/112"
  lan_interface: "br-lan"
  # Give the LAN the unrouted address 2001:2:f1b5::1/64. On a router with no
  # upstream IPv6, Android and Chrome send AAAA queries only with this: they
  # need a global-scope address. Leave it off with upstream IPv6: LAN clients
  # pick that address as a source and their connections fail. The advertised
  # IPv6 default route, which LAN clients reach the pool through, stays on
  # either way.
  # global_prefix: true
  dns:
    # listen: "[::1]:5365"   # the default; the init script points dnsmasq at this port
    upstream: "[::1]:5354"
    ttl: 60
  pool_grace_period: 60

peers: []
  # Static peers for bootstrapping (UDP or TCP):
  # - npub: "npub1qmc3cvfz0yu2hx96nq3gp55zdan2qclealn7xshgr448d3nh6lks7zel98"
  #   alias: "gateway"
  #   via_nostr: true
  #   addresses:
  #     - transport: udp
  #       addr: "test-us01.fips.network:2121"  # IP or hostname (e.g., "peer.example.com:2121")
  #     - transport: udp
  #       addr: "nat"  # Use node.rendezvous.nostr for Nostr/STUN hole punching
  #   connect_policy: auto_connect
